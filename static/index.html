<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="omi. A little space to think.">

  <title>omi. — a little space to think</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="universe">
    <div class="nebula nebula-one"></div>
    <div class="nebula nebula-two"></div>
    <div class="stars" id="stars"></div>
    <div class="noise"></div>
  </div>

  <div class="app-shell">

    <header class="topbar">
      <a class="brand" href="/" aria-label="omi home">
        omi<span>.</span>
      </a>

      <div class="topbar-center">
        <span class="status-dot"></span>
        <span id="system-status">SYSTEM ONLINE</span>
      </div>

      <button class="icon-button" id="new-chat" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </header>

    <main class="main-content">

      <section class="hero" id="hero">

        <div class="eyebrow">
          <span class="eyebrow-line"></span>
          YOUR PERSONAL INTELLIGENCE
          <span class="eyebrow-line"></span>
        </div>

        <div class="orb-scene" id="orb-scene">
          <div class="orb-glow"></div>
          <div class="orb-aura"></div>
          <div class="orb-ring orb-ring-one"></div>
          <div class="orb-ring orb-ring-two"></div>

          <div class="orb" id="orb">
            <div class="orb-surface"></div>
            <div class="orb-shine"></div>
            <div class="orb-shadow"></div>
            <div class="orb-reflection"></div>
          </div>

          <div class="orb-particle particle-one"></div>
          <div class="orb-particle particle-two"></div>
          <div class="orb-particle particle-three"></div>
          <div class="orb-particle particle-four"></div>
        </div>

        <div class="hero-copy">
          <h1>What's on your <em>mind?</em></h1>
          <p>A little space to think. An infinite space to explore.</p>
        </div>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain how Microsoft Foundry model inference works.">
            <span class="suggestion-icon">✧</span>
            Explore an idea
            <span class="suggestion-arrow">↗</span>
          </button>

          <button class="suggestion" data-prompt="Teach me how Azure managed identities work with a practical example.">
            <span class="suggestion-icon">◈</span>
            Learn something
            <span class="suggestion-arrow">↗</span>
          </button>

          <button class="suggestion" data-prompt="Help me understand Azure Cosmos DB and when to use it.">
            <span class="suggestion-icon">✳</span>
            Get curious
            <span class="suggestion-arrow">↗</span>
          </button>
        </div>
      </section>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="conversation-header">
          <div class="conversation-title">
            <span class="conversation-symbol">✳</span>
            <span>Conversation with omi</span>
          </div>
          <span class="conversation-label">A SPACE TO THINK</span>
        </div>

        <div class="messages" id="messages"></div>
      </section>

    </main>

    <div class="composer-area">

      <div class="composer-wrapper">
        <form class="composer" id="chat-form">
          <div class="composer-decoration">✳</div>

          <input
            type="text"
            id="message-input"
            placeholder="Ask omi anything..."
            autocomplete="off"
            maxlength="4000"
            aria-label="Message omi"
            required
          >

          <button type="submit" class="send-button" id="send-button" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </form>
      </div>

      <div class="bottom-meta">
        <span id="connection-status">✦ READY TO EXPLORE</span>
        <span>MADE FOR CURIOUS MINDS · OMI 001</span>
      </div>

    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
